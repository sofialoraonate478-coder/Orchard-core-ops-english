{% extends 'base.html' %}
{% block title %}Log In — Orchard Core Ops{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="grid-overlay"></div>

  <div class="auth-card glass-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="auth-logo-img" />
    </div>
    <h1 class="auth-title">Welcome</h1>
    <p class="auth-sub">Enter your credentials to access the support system.</p>

    <form class="auth-form" method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <span class="input-icon"></span>
          <input type="email" name="email" placeholder="user@email.com" required />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="input-icon"></span>
          <input type="password" name="password" id="passInput" placeholder="••••••••" required />
          <button type="button" class="toggle-pass" onclick="togglePass()">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full auth-btn">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <p class="auth-footer-text">
      Don't have an account? Request one from a system administrator.
    </p>
  </div>
</section>

<script>
function togglePass() {
  const inp = document.getElementById('passInput');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
