{% extends 'base.html' %}
{% block title %}Create Account — Orchard Core Ops{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="grid-overlay"></div>

  <div class="auth-card glass-card" style="max-width:480px;">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="auth-logo-img" />
    </div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Create a new account for the ticket system.</p>

    <form class="auth-form" method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <span class="input-icon"></span>
          <input type="text" name="username" placeholder="my_username" required />
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <span class="input-icon"></span>
          <input type="email" name="email" placeholder="user@email.com" required />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="input-icon"></span>
          <input type="password" name="password" id="passInput" placeholder="••••••••" required />
          <button type="button" class="toggle-pass" onclick="togglePass()">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label>Role</label>
        <select name="rol" id="rolSelect" onchange="toggleEmpresa()" required
                style="width:100%;padding:13px 16px;background:var(--white-dim2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--white);font-size:0.9rem;outline:none;">
          <option value="tecnico">🔧 Technician — manages tickets, views reports, cannot create accounts</option>
          <option value="agente">👤 Agent — creates tickets, replies and sees those of their company</option>
        </select>
      </div>

      <div class="form-group" id="empresaGroup" style="display:none;">
        <label>Agent's Company</label>
        <select name="empresa"
                style="width:100%;padding:13px 16px;background:var(--white-dim2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--white);font-size:0.9rem;outline:none;">
          <option value="SPARK">🏢 SPARK</option>
          <option value="BISSNISS">🏢 BISSNISS</option>
          <option value="HALO MK.">🏢 HALO MK.</option>
          <option value="CUSTOMER HUB">🏢 CUSTOMER HUB</option>
        </select>
      </div>

      <button type="submit" class="btn-primary btn-full auth-btn">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>
  </div>
</section>

<script>
function togglePass() {
  const inp = document.getElementById('passInput');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
function toggleEmpresa() {
  const rol = document.getElementById('rolSelect').value;
  const grupo = document.getElementById('empresaGroup');
  grupo.style.display = rol === 'agente' ? 'block' : 'none';
}
</script>
{% endblock %}
